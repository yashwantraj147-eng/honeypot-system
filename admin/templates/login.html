<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login — HoneypotNet Admin</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Segoe UI',sans-serif;background:#0b0e17;
       display:flex;justify-content:center;align-items:center;min-height:100vh}
  .card{background:linear-gradient(145deg,#12162a,#1a1f3a);padding:44px 38px;
        border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.55);width:100%;max-width:400px;
        border:1px solid rgba(255,255,255,.06)}
  .card h2{color:#7c5cfc;margin-bottom:28px;text-align:center;font-size:1.5em;
            letter-spacing:.5px}
  .card input{width:100%;padding:13px 16px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1);
              border-radius:8px;background:#0d1020;color:#e0e0e0;font-size:.95em;
              transition:border .2s}
  .card input:focus{outline:none;border-color:#7c5cfc}
  .card input::placeholder{color:#555}
  .card button{width:100%;padding:13px;border:none;border-radius:8px;
               background:linear-gradient(135deg,#7c5cfc,#e94560);color:#fff;
               font-size:1.05em;font-weight:600;cursor:pointer;letter-spacing:.3px;
               transition:opacity .2s}
  .card button:hover{opacity:.88}
  .err{color:#e94560;text-align:center;margin-bottom:14px;font-size:.88em}
</style>
</head>
<body>
<div class="card">
  <h2>🛡️ HoneypotNet Admin</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="POST">
    <input name="username" placeholder="Username" required autocomplete="off">
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
