# ============================================================
# HoneypotNet — Central Configuration Template
# ============================================================
# Copy this file to config.yaml and configure your secrets.
# All values can also be injected via environment variables:
#   HONEYPOT_ADMIN_USERNAME, HONEYPOT_ADMIN_PASSWORD,
#   HONEYPOT_SECRET_KEY, ABUSEIPDB_API_KEY, TELEGRAM_BOT_TOKEN
# ============================================================

general:
  # Name used in alert subjects / Telegram messages
  instance_name: "HoneypotNet-Alpha"
  # Path for the SQLite database (relative to project root)
  database_path: "data/honeypot.db"
  # Logging level: DEBUG | INFO | WARNING | ERROR
  log_level: "INFO"
  # Directory for text log files
  log_dir: "logs"

# ---- Service ports ----
services:
  ssh:
    enabled: true
    host: "0.0.0.0"
    port: 2222
    # RSA host key is auto-generated on first run if missing
    host_key_file: "data/ssh_host_key"
    banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
    max_auth_attempts: 6

  http:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    server_banner: "Apache/2.4.54 (Ubuntu)"

  ftp:
    enabled: true
    host: "0.0.0.0"
    port: 2121
    banner: "220 ProFTPD 1.3.5e Server (Debian)"
    max_auth_attempts: 5

  telnet:
    enabled: true
    host: "0.0.0.0"
    port: 2323
    banner: "Ubuntu 22.04 LTS"
    hostname: "gateway-srv01"

# ---- Admin dashboard ----
admin:
  # Bound to localhost (127.0.0.1) by default for security
  host: "127.0.0.1"
  port: 5000
  # Set via HONEYPOT_SECRET_KEY or provide a random 64-char string
  secret_key: ""
  username: "admin"
  # Set via HONEYPOT_ADMIN_PASSWORD or provide here
  password: ""

# ---- Geolocation (ip-api.com — free tier, no key needed) ----
geoip:
  enabled: true
  api_url: "http://ip-api.com/json/"
  # Free tier: 45 requests/min — the system rate-limits automatically
  rate_limit_per_minute: 45

# ---- Threat Intelligence — AbuseIPDB ----
threat_intel:
  enabled: false
  abuseipdb_api_key: ""
  abuseipdb_url: "https://api.abuseipdb.com/api/v2/check"
  # Confidence threshold (0-100) to flag an IP as malicious
  confidence_threshold: 50

# ---- Alert system ----
alerting:
  # Minimum seconds between alerts for the SAME attacker IP
  cooldown_seconds: 300

  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: ""
    password: ""
    from_addr: ""
    to_addrs: []

  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# ---- Rate-limiting (per-IP, across all services) ----
rate_limiting:
  enabled: true
  # Maximum connections from a single IP within the window
  max_connections: 30
  window_seconds: 60
