# ============================================================
#  HoneypotNet — docker-compose.yml
# ============================================================
#  Each honeypot runs in its own container.  They share:
#    • A named volume for the SQLite database
#    • A named volume for log files
#    • A bind-mounted config.yaml
#
#  Usage:
#    docker-compose up -d --build
#    docker-compose logs -f
# ============================================================

version: "3.9"

x-common: &common
  restart: unless-stopped
  volumes:
    - honeypot-data:/app/data
    - honeypot-logs:/app/logs
    - ./config.yaml:/app/config.yaml:ro
  networks:
    - honeypot-net

services:
  # ── SSH Honeypot ──
  ssh:
    build:
      context: .
      dockerfile: docker/Dockerfile.ssh
    container_name: honeypot-ssh
    <<: *common
    ports:
      - "2222:2222"

  # ── HTTP Honeypot ──
  http:
    build:
      context: .
      dockerfile: docker/Dockerfile.http
    container_name: honeypot-http
    <<: *common
    ports:
      - "8080:8080"

  # ── FTP Honeypot ──
  ftp:
    build:
      context: .
      dockerfile: docker/Dockerfile.ftp
    container_name: honeypot-ftp
    <<: *common
    ports:
      - "2121:2121"

  # ── Telnet Honeypot ──
  telnet:
    build:
      context: .
      dockerfile: docker/Dockerfile.telnet
    container_name: honeypot-telnet
    <<: *common
    ports:
      - "2323:2323"

  # ── Admin Dashboard ──
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: honeypot-admin
    <<: *common
    ports:
      - "5000:5000"
    depends_on:
      - ssh
      - http
      - ftp
      - telnet

volumes:
  honeypot-data:
  honeypot-logs:

networks:
  honeypot-net:
    driver: bridge
