services:
  honeypot-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeypot-system-v2
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    ports:
      # Host:Container port mappings
      - "22:2222"     # Standard SSH port mapped to SSH decoy
      - "80:8080"     # Standard HTTP port mapped to Web decoy
      - "21:2121"     # Standard FTP port mapped to FTP decoy
      - "23:2323"     # Standard Telnet port mapped to IoT decoy
      - "9090:9090"   # Real-time SOC Dashboard & Threat Intelligence Feeds
    environment:
      - SSH_PORT=2222
      - HTTP_PORT=8080
      - FTP_PORT=2121
      - TELNET_PORT=2323
      - API_PORT=9090
      - TARPIT_ENABLED=true
      - TARPIT_BYTE_RATE=10
      - MALICIOUS_IP_THRESHOLD=5
      - SENSOR_NAME=honeypot-grid-node-01
    volumes:
      # Persistent SQLite database & session keystroke recordings
      - ./data:/app/data
      - ./recordings:/app/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
